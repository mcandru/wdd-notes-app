services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads-data:/app/uploads
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: notes
      DB_NAME: notes
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: notes
      MYSQL_DATABASE: notes
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pnotes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  uploads-data:
