# A copy of the app for the end-to-end tests, with its own database.
name: notes-e2e

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8001:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: notes
      DB_NAME: notes
    command: sh -c "npm run seed && exec node server.js"
    init: true
    tmpfs:
      - /app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: notes
      MYSQL_DATABASE: notes
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pnotes"]
      interval: 5s
      timeout: 5s
      retries: 10
